server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.1"
      repository: "https://maven.lavalink.dev/releases"
  server:
    password: "${LAVALINK_SERVER_PASSWORD}"
    sources:
      # Wbudowany YouTube usunięty w v4 — obsługuje go wtyczka youtube-source.
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      # Filtry potrzebne dla /filter (EQ/bass/nightcore).
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    # 25 = typowa playlista YT bez obcinania; nasz wlasny cap to
    # NYXIO_MAX_PLAYLIST_ITEMS (100) i to on rzadzi.
    youtubePlaylistLoadLimit: 25
    playerUpdateInterval: 5
    youtubeSearchEnabled: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # Kolejnosc = priorytet. Lista wynika wprost z logow produkcyjnych:
    #   TVHTML5_SIMPLY -> "Sign in to confirm you're not a bot" (bot-check na
    #                     IP VPS-a; to on sciagal na nas wykrywanie bota)  -> WYCIETY
    #   IOS            -> "Invalid status code for player api response: 400"
    #                     (klient ubity po stronie YouTube)                -> WYCIETY
    #   WEB/WEBEMBEDDED-> "requires login" / "player configuration error",
    #                     bo pot.token byl PUSTY. Z dzialajacym pot-refresherem
    #                     to najpewniejsza sciezka, wiec ida na poczatek.
    #   TV             -> jedyny, ktory przechodzil autoryzacje (OAuth dziala),
    #                     ale jego strumien wywracal dekoder AAC
    #                     ("Expected decoding to halt, got: 5") -> ostatnia deska.
    clients:
      - MUSIC
      - WEB
      - MWEB
      - ANDROID_VR
      - WEBEMBEDDED
      - TV
    clientOptions:
      MUSIC:
        # music.youtube nie obsluguje zwyklych playlist YT.
        playlistLoading: false
      TV:
        # Nie zuzywaj sesji OAuth na wyszukiwanie i playlisty — TV ma byc
        # wylacznie awaryjnym zrodlem strumienia.
        searching: false
        playlistLoading: false
    # Zdalny deszyfrator sygnatur. Lokalny parser w 1.18.1 nie ogarnia
    # najnowszego player-script ("must find sig function") — sygnature
    # liczy serwis yt-cipher (sidecar w docker-compose, siec compose).
    # password musi byc rowne API_TOKEN yt-cipher (oba z NYXIO_YTCIPHER_TOKEN).
    remoteCipher:
      url: "http://yt-cipher:8001"
      password: "${YOUTUBE_REMOTE_CIPHER_PASSWORD:}"
      userAgent: "nyxio"
    # OAuth wlaczone:
    oauth:
      enabled: true
      refreshToken: "${YOUTUBE_REFRESH_TOKEN:}"
    # poToken/visitorData. Te wartosci to tylko stan STARTOWY — para wygasa po
    # kilku-kilkunastu godzinach, a plugin czyta ten plik wylacznie przy
    # starcie. Swiezosc utrzymuje serwis pot-refresher, ktory wysyla nowa pare
    # przez REST (POST /youtube) bez restartu Lavalinka.
    # Puste = polegamy w calosci na pot-refresherze.
    pot:
      token: "${YOUTUBE_PO_TOKEN:}"
      visitorData: "${YOUTUBE_VISITOR_DATA:}"

logging:
  level:
    root: INFO
    lavalink: INFO
