# Wspólna polityka logów. Bez tego jedna seria błędów YouTube (kilkanaście kB
# stack trace'u z Javy na każdy nieudany utwór) potrafi zapchać dysk VPS-a.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    logging: *default-logging
    volumes:
      # Trwała konfiguracja per-serwer (głośność, rola DJ, AutoPlay).
      # Bez tego ustawienia ginęły przy każdym przebudowaniu kontenera.
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_started
      lavalink:
        condition: service_healthy

  lavalink:
    # Tag ruchomy = niedeterministyczny deploy: `docker compose pull` może
    # podmienić działającą wersję na zepsutą. Przypnij konkretną wersję albo
    # digest w .env, np.
    #   NYXIO_LAVALINK_IMAGE=ghcr.io/lavalink-devs/lavalink:4.0.8
    image: ${NYXIO_LAVALINK_IMAGE:-ghcr.io/lavalink-devs/lavalink:4}
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Podstawiane w application.yml jako ${LAVALINK_SERVER_PASSWORD}.
      - LAVALINK_SERVER_PASSWORD=${NYXIO_LAVALINK_PASSWORD:-youshallnotpass}
      # OAuth youtube-source. Puste przy 1. starcie (device-login w logach),
      # potem wklej token do .env jako NYXIO_YOUTUBE_REFRESH_TOKEN.
      - YOUTUBE_REFRESH_TOKEN=${NYXIO_YOUTUBE_REFRESH_TOKEN:-}
      # Para poToken/visitorData. Na bieżąco podmienia ją serwis pot-refresher
      # przez REST (POST /youtube) — te zmienne są tylko wartością startową.
      - YOUTUBE_PO_TOKEN=${NYXIO_PO_TOKEN:-}
      - YOUTUBE_VISITOR_DATA=${NYXIO_VISITOR_DATA:-}
      # Haslo do zdalnego cipher (yt-cipher). Musi byc takie samo jak API_TOKEN
      # serwisu yt-cipher. Lavalink czyta je w application.yml jako
      # ${YOUTUBE_REMOTE_CIPHER_PASSWORD}.
      - YOUTUBE_REMOTE_CIPHER_PASSWORD=${NYXIO_YTCIPHER_TOKEN:-changeme}
      - _JAVA_OPTIONS=-Xmx1g -Xms1g
    depends_on:
      yt-cipher:
        condition: service_started
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      # UWAGA: NIE montować /opt/Lavalink/plugins. Każdy mount (bind/named)
      # jest root-owned i blokuje zapis wtyczki przez użytkownika 'lavalink'
      # (Permission denied). Bez mountu Lavalink pobiera plugin do katalogu
      # w obrazie (~1 MB, tylko przy (re)tworzeniu kontenera).
    healthcheck:
      # Lavalink posiada endpoint /version lub /
      test:
        [
          "CMD-SHELL",
          'wget --no-verbose --tries=1 --spider --header="Authorization: $${LAVALINK_SERVER_PASSWORD}" http://localhost:2333/version || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # Zdalny deszyfrator sygnatur YouTube. Lokalny parser w youtube-source
  # 1.18.1 nie ogarnia najnowszego player-script (blad "must find sig
  # function") — yt-cipher liczy sygnature po stronie serwera. Bez portu
  # na hosta: Lavalink siega po sieci compose (http://yt-cipher:8001).
  yt-cipher:
    image: ${NYXIO_YTCIPHER_IMAGE:-ghcr.io/kikkia/yt-cipher:master}
    restart: unless-stopped
    logging: *default-logging
    environment:
      - API_TOKEN=${NYXIO_YTCIPHER_TOKEN:-changeme}

  # Utrzymuje świeży poToken/visitorData w Lavalinku (POST /youtube, bez
  # restartu). Bez poTokena klienci WEB/WEBEMBEDDED zwracają "This video
  # requires login" / "Video player configuration error" — dokładnie to, co
  # widać było w logach.
  #
  # Domyślnie działa jako "dosyłacz": bierze parę z NYXIO_PO_TOKEN /
  # NYXIO_VISITOR_DATA i pilnuje, by Lavalink ją miał po każdym restarcie.
  # Generowanie w kontenerze włączasz przez NYXIO_POT_BASE_IMAGE +
  # NYXIO_POT_GENERATOR_CMD (patrz tools/pot_refresher/Dockerfile).
  pot-refresher:
    build:
      context: ./tools/pot_refresher
      args:
        POT_BASE_IMAGE: ${NYXIO_POT_BASE_IMAGE:-python:3.12-slim}
    restart: unless-stopped
    logging: *default-logging
    environment:
      - LAVALINK_URL=http://lavalink:2333
      - LAVALINK_PASSWORD=${NYXIO_LAVALINK_PASSWORD:-youshallnotpass}
      # Celowo BEZ YOUTUBE_REFRESH_TOKEN — Lavalink loguje cale ciala zadan,
      # wiec dosylanie tokenu OAuth wynosilo go do logow w plaintekscie.
      - POT_REFRESH_HOURS=${NYXIO_POT_REFRESH_HOURS:-6}
      # Puste = brak generowania w kontenerze (tryb dosyłacza). Ustaw razem
      # z NYXIO_POT_BASE_IMAGE, jeśli chcesz generować parę automatycznie;
      # przy złym poleceniu serwis loguje 'generator_output_unparsed' wraz
      # z ogonem wyjścia, po którym widać co generator faktycznie wypisał.
      - POT_GENERATOR_CMD=${NYXIO_POT_GENERATOR_CMD:-}
      # Para wygenerowana ręcznie (gdziekolwiek — nie musi to być ten VPS).
      - POT_TOKEN=${NYXIO_PO_TOKEN:-}
      - POT_VISITOR_DATA=${NYXIO_VISITOR_DATA:-}
    depends_on:
      lavalink:
        condition: service_healthy

  redis:
    image: ${NYXIO_REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - redis-data:/data

volumes:
  redis-data:
